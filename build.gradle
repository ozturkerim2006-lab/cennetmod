plugins {
    id 'eclipse'
    id 'idea'
    id 'java-library'
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
}

version = '1.0.0'
group = 'com.cennetmod'
base { archivesName = 'cennetmod' }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

minecraft {
    mappings channel: 'official', version: '1.21.1'
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            mods { cennetmod { source sourceSets.main } }
        }
        client { property 'forge.enabledGameTestNamespaces', 'cennetmod' }
        server { args '--nogui' }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories { }

dependencies {
    minecraft 'net.minecraftforge:forge:1.21.1-52.0.16'
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [mod_version: project.version]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml']) { expand replaceProperties }
}

tasks.named('jar', Jar).configure {
    manifest.attributes(['Implementation-Title': 'cennetmod', 'Implementation-Version': project.version])
    finalizedBy 'reobfJar'
}
